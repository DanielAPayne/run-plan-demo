# The run-plan demo: one lead-reply automation, watched the way a client's would be.
# Everything listens on this Mac only (127.0.0.1). Secrets are in .env (not in git).
name: rundemo

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_SUPER_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD}
      TZ: America/Chicago
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./db/schema.sql:/schema/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Stands in for the client's email service. Nothing leaves the Mac; every message is kept and can be read.
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "20000"
      TZ: America/Chicago
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - mpdata:/data

  # The alert channel. Deliberately separate from the email service above:
  # an outage of one must not silence alerts about it. For a client this is Slack, SMS or a second provider.
  alertbox:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "20000"
      TZ: America/Chicago
    ports:
      - "127.0.0.1:8026:8025"
    volumes:
      - abdata:/data

  n8n:
    image: n8nio/n8n:2.47.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Chicago
      TZ: America/Chicago
      # No telemetry, update checks or template downloads.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Keep 60 days of executions so a monthly report can be computed from them.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "1440"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./workflows/out:/demo/workflows:ro
      - ./secrets/credentials.json:/demo/credentials.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:5678/healthz"]
      interval: 15s
      timeout: 6s
      retries: 20

  # Watches from outside n8n: is n8n answering, is the heartbeat fresh, did today's test pass.
  # For a client this role is an external dead-man's-switch service, so it still works when the whole host is down.
  watchdog:
    image: postgres:17.11-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/watchdog/watchdog.sh"]
    environment:
      PGHOST: postgres
      PGUSER: demo
      PGDATABASE: demo
      PGPASSWORD: ${DEMO_DB_PASSWORD}
      TZ: America/Chicago
    volumes:
      - ./watchdog:/watchdog:ro

volumes:
  pgdata:
  mpdata:
  abdata:
  n8ndata:
